syntax = "proto3";

package rtype;

// ---------------------------------------------------------------------------
// Opcode 0x20 — GAME_START (Server → Client, TCP, Lobby → In-game)
// Sent to every client in the room when all players are ready.
// After this, the client opens the UDP channel and enters the In-game phase.
// player_index outside [0, player_count) MUST cause the client to disconnect.
// ---------------------------------------------------------------------------
message GameStart {
    uint32 room_id      = 1;
    uint32 player_index = 2; // this client's slot index (0–3)
    uint32 player_count = 3; // total number of players in the game (1–4)
}

// ---------------------------------------------------------------------------
// Opcode 0x30 — GAME_OVER (Server → Client, TCP, In-game → Lobby)
// Sent to all clients when the game ends.
// After this, the client closes the UDP channel and returns to the Lobby phase.
// player_scores always contains exactly 4 entries (0 for empty slots).
// ---------------------------------------------------------------------------
enum GameOverReason {
    ALL_DEAD         = 0;
    VICTORY          = 1;
    SERVER_SHUTDOWN  = 2;
}

message GameOver {
    GameOverReason  reason        = 1;
    uint32          score         = 2; // final cumulative score
    repeated uint32 player_scores = 3; // exactly 4 entries, one per slot
}

// ---------------------------------------------------------------------------
// Opcode 0x40 — LEAVE (Client → Server, TCP, Any phase)
// Graceful disconnect.  No payload fields.
// The server removes the client from its room (if any) and pushes an updated
// LobbyList to all remaining clients.
// ---------------------------------------------------------------------------
message Leave {}

// ---------------------------------------------------------------------------
// Opcode 0x50 — CHAT (Both directions, TCP, Lobby + In-game)
// Client → Server: client_id must be 0 (ignored by the server).
// Server → Client: client_id is the sender's ClientId (filled by the server).
// message must not exceed 256 UTF-8 bytes; longer messages MUST be dropped.
// ---------------------------------------------------------------------------
message Chat {
    uint32 client_id = 1; // 0 when sent by the client
    string message   = 2; // UTF-8, max 256 bytes
}
