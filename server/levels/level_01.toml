# R-Type — level 1.
# Read by the server only; clients receive the spawned entities through replication.
# Format: docs/gameplay/levels.md. Every invalid value is corrected or its event skipped, with a warning at start-up.
#
# Positions (`at`) are scroll distances in pixels. At 60 px/s, 72 px = 1.2 s and the level lasts 5400 px = 90 s, plus
# the boss fight, during which the scroll stops. Waves keep the pacing of the former hardcoded loop: about one alien
# scout every 1.2 s.

[level]
name = "Sector 1"
scroll_speed = 60.0

# --- Opening: two diagonals ---

[[events]]
at = 72.0
type = "spawn"
prefab = "alien_scout"
count = 6
interval = 1.2
y = 160.0
spacing_y = 80.0

[[events]]
at = 576.0
type = "spawn"
prefab = "alien_scout"
count = 6
interval = 1.2
y = 560.0
spacing_y = -80.0

# --- Quick trios, top then bottom ---

[[events]]
at = 1080.0
type = "spawn"
prefab = "alien_scout"
count = 3
interval = 0.4
y = 200.0

[[events]]
at = 1224.0
type = "spawn"
prefab = "alien_scout"
count = 3
interval = 0.4
y = 520.0

# --- Middle line ---

[[events]]
at = 1440.0
type = "spawn"
prefab = "alien_scout"
count = 6
interval = 1.2
y = 360.0

# --- Mirrored pairs ---

[[events]]
at = 1944.0
type = "spawn"
prefab = "alien_scout"
count = 4
interval = 1.2
y = 220.0

[[events]]
at = 1944.0
type = "spawn"
prefab = "alien_scout"
count = 4
interval = 1.2
y = 500.0

# --- Breather: the scroll slows down ---

[[events]]
at = 2304.0
type = "scroll"
speed = 40.0

[[events]]
at = 2400.0
type = "spawn"
prefab = "alien_scout"
count = 5
interval = 1.2
y = 280.0
spacing_y = 40.0

# --- Back to full speed: a wall of five ---

[[events]]
at = 2700.0
type = "scroll"
speed = 60.0

[[events]]
at = 2880.0
type = "spawn"
prefab = "alien_scout"
count = 5
interval = 0.0
y = 160.0
spacing_y = 100.0

# --- Zigzag ---

[[events]]
at = 3240.0
type = "spawn"
prefab = "alien_scout"
count = 3
interval = 2.4
y = 160.0
spacing_y = 0.0

[[events]]
at = 3312.0
type = "spawn"
prefab = "alien_scout"
count = 3
interval = 2.4
y = 560.0

# --- Finale: two crossing diagonals ---

[[events]]
at = 4032.0
type = "spawn"
prefab = "alien_scout"
count = 8
interval = 1.2
y = 140.0
spacing_y = 60.0

[[events]]
at = 4068.0
type = "spawn"
prefab = "alien_scout"
count = 8
interval = 1.2
y = 580.0
spacing_y = -60.0

# --- Boss: the scroll stops until it is destroyed ---

[[events]]
at = 4800.0
type = "boss"
prefab = "boss_core"
script = "scripts/Boss.wren"
y = 360.0
health = 40

[[events]]
at = 5400.0
type = "end"

# --- Terrain: a ground through the middle of the level, then a ceiling before the finale ---

[[terrain]]
from = 1800.0
to = 3200.0
side = "bottom"
height = 100.0

[[terrain]]
from = 3400.0
to = 4000.0
side = "top"
height = 80.0
