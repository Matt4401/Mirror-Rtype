# R-Type — level 2: the gunline.
# Read by the server only; clients receive the spawned entities through replication.
# Format: docs/gameplay/levels.md. Every invalid value is corrected or its event skipped, with a warning at start-up.
#
# Positions (`at`) are scroll distances in pixels: at 60 px/s, 60 px is one second.
# Scouts, joined by gunners that fire at the ships. About 100 s.

[level]
name = "Sector 2 - Gunline"
scroll_speed = 60.0

# --- Opening: scouts, then the first gunner ---

[[events]]
at = 120.0
type = "spawn"
prefab = "alien_scout"
count = 5
interval = 0.8
y = 360.0

[[events]]
at = 480.0
type = "spawn"
prefab = "alien_gunner"
y = 360.0

