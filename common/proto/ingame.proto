syntax = "proto3";

package rtype;

// ---------------------------------------------------------------------------
// Opcode 0x60 — PLAYER_INPUT (Client → Server, UDP, In-game)
// Sent every game tick (~60 Hz).  Lost datagrams are replaced by the next one.
// The server applies the input from the most recent seq received per client.
// Stale inputs (seq <= last received seq, wrapping) MUST be discarded.
// ---------------------------------------------------------------------------
message PlayerInput {
    uint32 seq     = 1; // monotonically increasing tick counter (wrapping u32)
    uint32 buttons = 2; // bitmask — see ButtonMask enum below
}

// Bitmask values for PlayerInput.buttons.  Multiple bits may be set simultaneously.
enum ButtonMask {
    NONE  = 0x00;
    UP    = 0x01;
    DOWN  = 0x02;
    LEFT  = 0x04;
    RIGHT = 0x08;
    SHOOT = 0x10;
}

// ---------------------------------------------------------------------------
// Opcode 0x70 — WORLD_STATE (Server → Client, UDP, In-game)
// Sent every game tick (~60 Hz).  Clients render the most recent snapshot;
// older snapshots MUST be discarded (tick comparison, wrapping u32).
// An entity with health == 0 appears exactly once (the tick it died) to allow
// clients to play a death animation; it MUST NOT appear in subsequent snapshots.
// Note: the serialised payload MUST NOT exceed 1192 bytes (UDP limit).
// ---------------------------------------------------------------------------
enum EntityType {
    PLAYER         = 0; // subtype = player index (0–3)
    ENEMY          = 1; // subtype = enemy model ID
    PLAYER_MISSILE = 2; // subtype = player index
    ENEMY_MISSILE  = 3; // subtype = 0
    POWERUP        = 4; // subtype = powerup type
}

message EntityState {
    uint32     entity_id = 1; // unique, stable for the entity's lifetime
    EntityType type      = 2;
    uint32     subtype   = 3; // type-specific variant — see EntityType comments
    sint32     x         = 4; // X position in pixels (0 = left edge)
    sint32     y         = 5; // Y position in pixels (0 = top edge)
    uint32     health    = 6; // 0 means the entity died this tick
    uint32     flags     = 7; // bit 0 = alive, bit 1 = shooting, bits 2–7 reserved
}

message WorldState {
    uint32              tick     = 1;
    repeated EntityState entities = 2;
}
