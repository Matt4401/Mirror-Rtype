name: Cross-platform build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: ${{ github.repository == 'Matt4401/Mirror-Rtype' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Restore xmake packages cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.xmake/packages
            ~\AppData\Local\.xmake\packages
          key: xmake-pkgs-v2-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-pkgs-v2-${{ runner.os }}-

      - name: Configure
        run: xmake f -m release -y

      - name: Dump xmake package logs
        if: failure()
        shell: bash
        run: |
          for dir in ~/.xmake/cache/packages ~/AppData/Local/.xmake/cache/packages; do
            [ -d "$dir" ] || continue
            find "$dir" -path '*.failed/logs/*.txt' -print0 | while IFS= read -r -d '' log; do
              echo "::group::$log"
              grep -n -m 40 -A 4 -E "error (C|LNK)[0-9]+|FAILED:" "$log" || true
              tail -n 200 "$log"
              echo "::endgroup::"
            done
          done

      - name: Build
        run: xmake build -v -y

      - name: Run tests
        run: xmake test "test_*/*"

  engine-package:
    name: Standalone engine + games on the package (ubuntu-latest)
    if: ${{ github.repository == 'Matt4401/Mirror-Rtype' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Restore xmake packages cache
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: xmake-pkgs-v2-${{ runner.os }}-${{ hashFiles('xmake.lua', 'engine/xmake.lua') }}
          restore-keys: |
            xmake-pkgs-v2-${{ runner.os }}-

      # The engine on its own, as its own project: proves it needs nothing from the games.
      - name: Build and test the engine alone
        working-directory: engine
        run: |
          xmake f -P . -m release --tests=y -y
          xmake build -P . -y
          xmake test -P .

      # The games on the installed squacaron package instead of the in-tree engine.
      - name: Build the games on the squacaron package
        run: |
          xmake f -m release --engine_package=y -y
          xmake require --force -y squacaron
          xmake build -y

      - name: Run the game tests
        run: xmake test "test_*/*"
