name: my_pgp mirror CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  BUILD_MODE: release
  TARGET_REPO_URL: "git@github.com:EpitechPGE3-2026/G-ING-500-NAN-5-1-rtype-3.git"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    name: Check C++ formatting and linting
    if: ${{ github.repository == 'Matt4401/Mirror-Rtype' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format clang-tidy \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Restore xmake packages cache
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-pkgs-${{ runner.os }}-

      - name: Generate compile_commands.json
        run: |
          xmake f -m ${{ env.BUILD_MODE }} -y
          xmake project -k compile_commands build

      - name: Run C++ linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        with:
          version: "20"
          style: "file"
          tidy-checks: ""
          database: "build"
          ignore: ".github|build|tests"
          file-annotations: "true"
          step-summary: "true"

      - name: Fail when checks fail
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  build-and-test:
    name: Build and run tests
    needs: cpp-linter
    if: ${{ github.repository == 'Matt4401/Mirror-Rtype' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Restore xmake packages cache
        uses: actions/cache@v6.1
        with:
          path: ~/.xmake/packages
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-pkgs-${{ runner.os }}-

      - name: Configure xmake
        run: xmake f -m ${{ env.BUILD_MODE }} -y

      - name: Build binaries
        run: xmake -v

      - name: Check binaries
        run: |
          test -x r-type_client
          test -x r-type_server

      - name: Run tests
        run: xmake test

      - name: Upload server binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: r-type_server
          path: r-type_server
          retention-days: 1

  push_to_mirror:
    name: Push to target repository
    needs: build-and-test
    if: ${{ github.repository == 'Matt4401/Mirror-Rtype' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1.1
        with:
          target_repo_url: ${{ env.TARGET_REPO_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }} # link to matt repo

  deploy_to_vps:
    name: Deploy server to VPS
    needs: build-and-test
    if: ${{ github.repository == 'Matt4401/Mirror-Rtype' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: r-type_server

      - name: Copy binary to VPS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "r-type_server"
          target: "/home/rtype/server_deploy"
          overwrite: true

      - name: Restart server service on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            chmod +x /home/rtype/server_deploy/r-type_server
            systemctl --user restart rtype-server.service
            systemctl --user status rtype-server.service
