# R-Type client configuration.
# Every setting is optional: a missing one keeps its default value, an invalid one is corrected and reported
# on startup. Deleting this file runs the client with the defaults.

[audio]
# Audio library: "auto" (best available), "raylib", or "null" (no sound, no audio device opened).
backend = "auto"
# How many copies of the same sound can overlap (1 to 16).
voices_per_sound = 4
# How many sounds can play at once across all sounds (1 to 256); the oldest one stops beyond that.
max_active_voices = 32

[audio.volume]
# Linear gains between 0.0 (silent) and 1.0 (full).
master = 1.0
music = 1.0
sfx = 1.0

[audio.spatial]
# Pan sounds left/right and fade them with distance, from the position of the entity emitting them.
enabled = true
# Horizontal distance (pixels) from the listener at which a sound reaches its widest pan.
pan_range = 640.0
# Widest pan, from 0.0 (always centered) to 1.0 (one speaker only).
max_pan = 0.6
# Sounds closer than this (pixels) keep their full volume...
min_distance = 750.0
# ...and fade out linearly until they are silent at this distance.
max_distance = 1500.0
