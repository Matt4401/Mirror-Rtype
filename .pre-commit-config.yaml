repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c++, c]
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p=.
        language: system
        types_or: [c++, c]
        exclude: (^tests/|.*\.tpp$)

  - repo: local
    hooks:
      - id: docstring-coverage
        name: Check C++ docstring coverage
        entry: python3 scripts/check_docstring_coverage.py
        args: [--min-coverage, "80", --dirs, "engine/src"]
        language: system
        pass_filenames: false
        always_run: true
