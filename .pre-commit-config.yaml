repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [--style=file]
      - id: clang-tidy
        args: [-p=.]
        exclude: (^tests/|.*\.tpp$)

  - repo: local
    hooks:
      - id: docstring-coverage
        name: Check C++ docstring coverage
        entry: python3 scripts/check_docstring_coverage.py
        args: [--min-coverage, "80", --dirs, "engine/src"]
        language: system
        pass_filenames: false
        always_run: true
